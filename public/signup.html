<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up - MyPlatform</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0b0b;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.auth-box {
    width: min(420px, calc(100% - 30px));
    padding: 30px;
    background: #151515;
    border: 1px solid #2c2c2c;
    border-radius: 16px;
}

.logo {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
}

.logo span {
    color: #ff2d55;
}

.subtitle {
    text-align: center;
    color: #999;
    margin-bottom: 28px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #ddd;
    font-size: 14px;
}

input {
    width: 100%;
    height: 46px;
    margin-bottom: 18px;
    padding: 0 14px;
    background: #0f0f0f;
    border: 1px solid #3d3d3d;
    border-radius: 8px;
    color: white;
    outline: none;
}

input:focus {
    border-color: #777;
}

button {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 8px;
    background: #ff2d55;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

#message {
    min-height: 22px;
    margin-top: 18px;
    text-align: center;
    color: #aaa;
    font-size: 14px;
}

.login-link {
    margin-top: 20px;
    text-align: center;
    color: #999;
    font-size: 14px;
}

.login-link a {
    color: #ff2d55;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="auth-box">

    <div class="logo">
        My<span>Platform</span>
    </div>

    <div class="subtitle">
        Create your account
    </div>

    <form id="signupForm">

        <label for="username">Username</label>

        <input
            id="username"
            type="text"
            placeholder="Choose a username"
            minlength="3"
            maxlength="30"
            required
        >

        <label for="email">Email</label>

        <input
            id="email"
            type="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>

        <input
            id="password"
            type="password"
            placeholder="Create a password"
            minlength="6"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div id="message"></div>

    <div class="login-link">
        Already have an account?
        <a href="/login.html">Login</a>
    </div>

</div>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
    "https://xhqhnafxwblskgjrveqy.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_vH0tiWjZW5z6l_5kANO_ig_Y3odvC3-";

const supabase =
    createClient(SUPABASE_URL, SUPABASE_KEY);

const form =
    document.getElementById("signupForm");

const message =
    document.getElementById("message");

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const username =
        document.getElementById("username")
            .value
            .trim();

    const email =
        document.getElementById("email")
            .value
            .trim();

    const password =
        document.getElementById("password")
            .value;

    if (username.length < 3) {
        message.textContent =
            "Username must be at least 3 characters.";
        return;
    }

    message.textContent =
        "Creating account...";

    const { data, error } =
        await supabase.auth.signUp({
            email: email,
            password: password
        });

    if (error) {
        message.textContent =
            error.message;
        return;
    }

    if (!data.user) {
        message.textContent =
            "Account could not be created.";
        return;
    message.textContent =
    "Account created successfully! Please check your email to confirm your account.";

setTimeout(() => {
    window.location.href = "/login.html";
}, 2000);

    message.textContent =
        "Account created successfully!";

    setTimeout(() => {
        window.location.href =
            "/login.html";
    }, 1500);

});

</script>

</body>
</html>
