<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyPlatform</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;

            overflow-x: hidden;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;

            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: #aaa;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 70px 30px;
        }

        .title {
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 50px;
            text-align: center;
        }

        /* =========================
           OPTIONS
        ========================= */

        .options {
    width: 100%;
    max-width: 1100px;

    display: flex;
    gap: 24px;

    overflow-x: auto;
    overflow-y: hidden;

    padding: 10px 4px 20px;

    scrollbar-width: none;
}

.options::-webkit-scrollbar {
    display: none;
}

.option {
    flex: 0 0 280px;
}

        .option {
            min-height: 280px;

            background: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 18px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 30px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .option:hover {
            transform: translateY(-6px);
            background: #181818;
            border-color: #555;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 25px;
        }

        .option-title {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
        }

        .option-description {
            margin-top: 12px;
            color: #888;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 750px) {

            .main {
                padding: 45px 15px;
            }

            .title {
                font-size: 28px;
                margin-bottom: 30px;
            }

            .options {
                grid-template-columns: repeat(3, 1fr);
                max-width: 500px;
            }

            .option {
                min-height: 190px;
            }

        }
/* =========================
   BOTTOM NAVIGATION
========================= */

.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;

    height: 70px;

    background: rgba(12, 12, 12, 0.97);
    border-top: 1px solid #292929;

    display: flex;
    align-items: center;
    justify-content: space-around;

    z-index: 9999;
}

.nav-item {
    flex: 1;

    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 5px;

    color: #777;
    text-decoration: none;

    font-size: 12px;
}

.nav-icon {
    font-size: 24px;
    line-height: 1;
}

.nav-item.active {
    color: white;
}

.nav-item:hover {
    color: white;
}

/* =========================
   YOUR AI TUTORS
========================= */

.ai-tutors-section {
    width: 100%;
    max-width: 1100px;
    margin-top: 50px;
}

.ai-tutors-section h2 {
    margin: 0 0 20px;
    font-size: 26px;
    font-weight: 600;
}

.ai-tutors {
    width: 100%;

    display: flex;
    gap: 20px;

    overflow-x: auto;
    overflow-y: hidden;

    padding: 10px 4px 20px;

    scrollbar-width: none;
}

.ai-tutors::-webkit-scrollbar {
    display: none;
}

.ai-card {
    flex: 0 0 220px;
    min-height: 150px;

    background: #121212;
    border: 1px solid #2a2a2a;
    border-radius: 18px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 20px;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
}

.ai-card:hover {
    transform: translateY(-4px);
    background: #181818;
    border-color: #555;
}

.ai-icon {
    font-size: 45px;
    margin-bottom: 15px;
}

.ai-name {
    font-size: 20px;
    font-weight: 600;
}
    </style>
</head>

<body>

    <header class="header">

        <div class="logo">
            My<span>Platform</span>
        </div>

    </header>


    <main class="main">

        <div class="title">
            What do you want to create?
        </div>


        <div class="options">

            <!-- PERSONAL AI -->

            <div
                class="option"
                onclick="showMessage('Personal AI workspace coming soon.')"
            >

                <div class="icon">
                    🤖
                </div>

                <div class="option-title">
                    Create your Personal AI
                </div>

                <div class="option-description">
                    Build an AI designed around you.
                </div>

            </div>


            <!-- GAME -->

            <div
                class="option"
                onclick="showMessage('Game creation workspace coming soon.')"
            >

                <div class="icon">
                    🎮
                </div>

                <div class="option-title">
                    Build your Game
                </div>

                <div class="option-description">
                    Create your own interactive world.
                </div>

            </div>


            <!-- 3D PROJECT -->

            <div
                class="option"
                onclick="showMessage('3D project workspace coming soon.')"
            >

                <div class="icon">
                    🧊
                </div>

                <div class="option-title">
                    Build your 3D Project
                </div>

                <div class="option-description">
                    Create and explore 3D experiences.
                </div>

            </div>

        </div>
<!-- =========================
     YOUR AI TUTORS
========================= -->

<section class="ai-tutors-section">

    <h2>Your AI Tutors</h2>

    <div class="ai-tutors">

        <div class="ai-card">
            <div class="ai-icon">🤖</div>
            <div class="ai-name">AI-1</div>
        </div>

        <div class="ai-card">
            <div class="ai-icon">🤖</div>
            <div class="ai-name">AI-2</div>
        </div>

        <div class="ai-card">
            <div class="ai-icon">🤖</div>
            <div class="ai-name">AI-3</div>
        </div>

        <div class="ai-card">
            <div class="ai-icon">🤖</div>
            <div class="ai-name">AI-4</div>
        </div>

    </div>

</section>
    </main>


    <script>

        function showMessage(message) {
            alert(message);
        }

    </script>
<!-- =========================
     BOTTOM NAVIGATION
========================= -->

<nav class="bottom-nav">

    <a href="/home.html" class="nav-item active">
        <span class="nav-icon">⌂</span>
        <span>Home</span>
    </a>

    <a href="/index.html" class="nav-item">
        <span class="nav-icon">▶</span>
        <span>Feed</span>
    </a>

    <a href="/profile.html" class="nav-item">
        <span class="nav-icon">●</span>
        <span>Profile</span>
    </a>

</nav>
</body>
</html>
