<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MyPlatform - Profile</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f0f0f;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

button {
    font-family: inherit;
}

button:active {
    transform: scale(.98);
}


/* =========================
   TOP HEADER
========================= */

.top-header {
    height: 60px;

    background: #0f0f0f;

    border-bottom: 1px solid #292929;

    display: flex;

    align-items: center;

    position: sticky;

    top: 0;

    z-index: 100;
}

.header-inner {
    width: 100%;

    max-width: 935px;

    margin: auto;

    padding: 0 18px;

    display: flex;

    align-items: center;

    position: relative;

    height: 100%;
}

.back-button {
    border: none;

    background: transparent;

    color: white;

    font-size: 26px;

    cursor: pointer;

    padding: 5px 10px 5px 0;
}

.logo {
    font-size: 20px;

    font-weight: bold;

    cursor: pointer;
}

.logo span {
    color: #ff1744;
}


/* CENTER USERNAME */

.top-username {
    position: absolute;

    left: 50%;

    transform: translateX(-50%);

    max-width: 55%;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    font-size: 17px;

    font-weight: 700;

    text-align: center;
}


/* THREE LINE MENU */

.menu-button {
    margin-left: auto;

    width: 42px;

    height: 42px;

    border: none;

    background: transparent;

    color: white;

    cursor: pointer;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 5px;
}

.menu-button span {
    display: block;

    width: 22px;

    height: 2px;

    background: white;

    border-radius: 2px;
}


/* =========================
   PAGE
========================= */

.profile-container {
    width: 100%;

    max-width: 935px;

    margin: auto;

    padding: 28px 18px 70px;
}


/* =========================
   LOADING
========================= */

.loading {
    text-align: center;

    color: #999;

    padding: 60px 20px;
}


/* =========================
   PROFILE HEADER
========================= */

.profile-header {
    display: grid;

    grid-template-columns: 150px 1fr;

    column-gap: 35px;

    align-items: start;
}


/* =========================
   PROFILE PHOTO
========================= */

.avatar-wrapper {
    display: flex;

    justify-content: center;

    align-items: flex-start;
}

.avatar {
    width: 118px;

    height: 118px;

    border-radius: 50%;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #ff1744,
            #7c4dff
        );

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 42px;

    font-weight: bold;

    flex-shrink: 0;
}

.avatar img {
    width: 100%;

    height: 100%;

    object-fit: cover;
}


/* =========================
   PROFILE INFORMATION
========================= */

.profile-information {
    min-width: 0;
}

.name-row {
    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 18px;
}

.full-name {
    margin: 0;

    font-size: 24px;

    font-weight: 600;

    word-break: break-word;
}


/* =========================
   STATS
========================= */

.stats {
    display: flex;

    align-items: center;

    gap: 34px;
}

.stat {
    text-align: left;
}

.stat-number {
    display: block;

    font-size: 17px;

    font-weight: 700;
}

.stat-label {
    display: block;

    margin-top: 3px;

    color: #aaa;

    font-size: 13px;
}


/* =========================
   BIO
========================= */

.bio-area {
    margin-top: 22px;

    max-width: 600px;
}

.bio {
    margin: 0;

    color: #ddd;

    line-height: 1.5;

    white-space: pre-wrap;

    word-break: break-word;
}


/* =========================
   ACTION BUTTONS
========================= */

.profile-actions {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-top: 22px;
}

.action-button {
    height: 38px;

    border-radius: 8px;

    border: 1px solid #3a3a3a;

    cursor: pointer;

    font-size: 14px;

    font-weight: 700;
}

.edit-profile {
    background: #fff;

    color: #000;

    border-color: #fff;
}

.share-profile {
    background: #181818;

    color: #fff;
}

/* =========================
   PROFILE TABS
========================= */


/* =========================
   POSTS LIST
========================= */

.tab-content {
    margin-top: 4px;
}

.post-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.post-card {
    display: flex;

    width: 100%;

    min-height: 110px;

    background: #181818;

    border-bottom: 1px solid #292929;

    overflow: hidden;

    cursor: pointer;
}

.post-card img,
.post-card video {
    width: 180px;

    height: 110px;

    object-fit: cover;

    display: block;

    flex-shrink: 0;
}

/* POST INFORMATION */

.post-info {
    padding: 10px 14px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    min-width: 0;
}

.post-title {
    font-size: 16px;

    font-weight: 700;

    color: white;

    line-height: 1.3;

    overflow: hidden;

    display: -webkit-box;

    -webkit-line-clamp: 2;

    -webkit-box-orient: vertical;
}

.post-username {
    color: #aaa;

    font-size: 13px;

    margin-top: 7px;
}

.post-meta {
    color: #777;

    font-size: 12px;

    margin-top: 5px;
}

.post-placeholder {
    width: 100%;

    height: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    color: #777;

    font-size: 13px;

    padding: 15px;

    text-align: center;
}


/* =========================
   VIDEO INDICATOR
========================= */

.video-indicator {
    position: absolute;

    top: 8px;

    right: 8px;

    background: rgba(0,0,0,.65);

    border-radius: 50%;

    width: 27px;

    height: 27px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 12px;
}


/* =========================
   EMPTY STATE
========================= */

.empty-state {
    padding: 70px 20px;

    text-align: center;

    color: #888;
}

.empty-icon {
    font-size: 40px;

    margin-bottom: 12px;
}

.empty-title {
    color: white;

    font-weight: 700;

    margin-bottom: 7px;
}

.empty-description {
    font-size: 13px;
}


/* =========================
   EDIT PANEL
========================= */

.edit-panel {
    display: none;

    margin-top: 25px;

    background: #181818;

    border: 1px solid #292929;

    border-radius: 12px;

    padding: 20px;
}

.edit-panel h2 {
    margin-top: 0;
}

.edit-panel label {
    display: block;

    margin-top: 14px;

    margin-bottom: 6px;

    color: #ccc;

    font-size: 14px;
}

.edit-panel input,
.edit-panel textarea {
    width: 100%;

    background: #0f0f0f;

    border: 1px solid #333;

    color: white;

    border-radius: 8px;

    padding: 11px;

    outline: none;
}

.edit-panel textarea {
    min-height: 100px;

    resize: vertical;
}

.edit-panel input:focus,
.edit-panel textarea:focus {
    border-color: #666;
}

.edit-buttons {
    display: flex;

    gap: 10px;

    margin-top: 15px;
}

.save-profile,
.cancel-profile {
    border: none;

    border-radius: 8px;

    padding: 11px 18px;

    cursor: pointer;

    font-weight: 700;
}

.save-profile {
    background: #ff1744;

    color: white;
}

.cancel-profile {
    background: #333;

    color: white;
}


/* =========================
   MENU PANEL
========================= */

.profile-menu-panel {
    display: none;

    position: fixed;

    top: 65px;

    right: 18px;

    width: 220px;

    background: #181818;

    border: 1px solid #333;

    border-radius: 12px;

    padding: 7px;

    z-index: 200;

    box-shadow:
        0 10px 30px rgba(0,0,0,.5);
}

.profile-menu-item {
    width: 100%;

    padding: 12px;

    background: transparent;

    color: white;

    border: none;

    border-radius: 8px;

    text-align: left;

    cursor: pointer;
}

.profile-menu-item:hover {
    background: #242424;
}
/* =========================
   PROFILE MENU TITLE
========================= */

.profile-menu-title {
    padding: 10px 12px 8px;

    color: #fff;

    font-size: 13px;

    font-weight: 700;

    text-align: left;
}


/* =========================
   PROFILE MENU DIVIDER
========================= */

.profile-menu-divider {
    height: 1px;

    background: #333;

    margin: 7px 4px;
}
.profile-menu-item.logout-item {
    color: #ff5270;
}


/* =========================
   MOBILE
========================= */

@media(max-width: 650px) {

    .top-header {
        height: 56px;
    }

    .logo {
        display: none;
    }

    .top-username {
        max-width: 65%;

        font-size: 16px;
    }

    .profile-container {
        padding:
            22px 12px 50px;
    }

    .profile-header {
        grid-template-columns:
            88px 1fr;

        column-gap: 18px;
    }

    .avatar {
        width: 82px;

        height: 82px;

        font-size: 30px;
    }

    .full-name {
        font-size: 20px;
    }

    .name-row {
        margin-bottom: 13px;
    }

    .stats {
        gap: 18px;
    }

    .stat-number {
        font-size: 15px;
    }

    .stat-label {
        font-size: 11px;
    }

    .bio-area {
        margin-top: 18px;
    }

    .profile-actions {
        margin-top: 18px;
    }

    .profile-tabs {
        margin-top: 30px;
    }

    .profile-tab {
        height: 52px;
    }

    .post-grid {
        gap: 2px;
    }

}
/* =========================
   PROFILE TABS
========================= */

.profile-tabs {
    width: 100%;
    display: flex;
    align-items: center;
    background: #000;
    border-bottom: 1px solid #292929;
    overflow-x: auto;
    scrollbar-width: none;
    margin-top: 30px;
}

.profile-tabs::-webkit-scrollbar {
    display: none;
}

.profile-tab {
    flex: 1;
    min-width: 90px;
    height: 52px;
    padding: 0 18px;
    border: none;
    background: #000;
    color: #888;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    position: relative;
}

.profile-tab:hover {
    color: #fff;
}

.profile-tab.active {
    color: #fff;
}

.profile-tab.active::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 18px;
    right: 18px;
    height: 2px;
    background: #fff;
}

.profile-tab-label {
    display: inline;
}

/* =========================
   SMALL PHONES
========================= */

@media(max-width: 380px) {

    .profile-header {
        grid-template-columns:
            75px 1fr;

        column-gap: 12px;
    }

    .avatar {
        width: 70px;

        height: 70px;
    }

    .full-name {
        font-size: 18px;
    }

    .stats {
        gap: 12px;
    }

    .stat-number {
        font-size: 14px;
    }

    .stat-label {
        font-size: 10px;
    }

}

</style>

<script type="module">

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
    "https://xhqhnafxwblskgjrveqy.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_vH0tiWjZW5z6l_5kANO_ig_Y3odvC3-";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;

let currentProfile = null;


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile() {

    try {

        const {
            data,
            error
        } =
        await supabase.auth.getUser();


        if (
            error ||
            !data ||
            !data.user
        ) {

            window.location.href =
                "/login.html";

            return;
        }


        currentUser =
            data.user;


        const {
            data: profile,
            error: profileError
        } =
        await supabase
            .from("profiles")
            .select(
                "username, full_name, avatar_url, bio"
            )
            .eq(
                "id",
                currentUser.id
            )
            .single();


        if (profileError) {

            console.error(
                "Profile error:",
                profileError
            );

            document.getElementById(
                "loading"
            ).textContent =
                "Could not load profile.";

            return;
        }


        currentProfile =
            profile;


        /* USERNAME */

        const username =
            profile.username ||
            "user";


        document.getElementById(
            "topUsername"
        ).textContent =
            username;


        /* FULL NAME */

        document.getElementById(
            "fullName"
        ).textContent =
            profile.full_name ||
            username;


        /* BIO */

        document.getElementById(
            "bio"
        ).textContent =
            profile.bio ||
            "Describe yourself";


        /* AVATAR */

        const avatar =
            document.getElementById(
                "avatar"
            );


        if (
            profile.avatar_url
        ) {

            avatar.innerHTML =
                `
                <img
                    src="${escapeHtml(
                        profile.avatar_url
                    )}"
                    alt="Profile photo"
                >
                `;

        } else {

            avatar.textContent =
                username
                    .charAt(0)
                    .toUpperCase();

        }


        /* EDIT FIELDS */

        document.getElementById(
            "editUsername"
        ).value =
            profile.username ||
            "";


        document.getElementById(
            "editFullName"
        ).value =
            profile.full_name ||
            "";


        document.getElementById(
            "editBio"
        ).value =
            profile.bio ||
            "";


        /* LOAD POSTS */

        await loadUserPosts();


        /* SHOW PAGE */

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "profileArea"
        ).style.display =
            "block";


    } catch (error) {

        console.error(
            error
        );

        document.getElementById(
            "loading"
        ).textContent =
            "Something went wrong.";

    }

}


/* =========================
   LOAD USER POSTS
========================= */

async function loadUserPosts() {

    const {
        data,
        error
    } =
    await supabase
        .from("videos")
        .select(
            "id, title, video_url, thumbnail_url, content_type, views, created_at"
        )
        .eq(
            "user_id",
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "Posts error:",
            error
        );

        return;
    }


    const posts =
        data || [];


    /* POST COUNT */

    document.getElementById(
        "postCount"
    ).textContent =
        posts.length;


    renderPostGrid(
        "profilePostGrid",
        posts
    );


    /* VIDEOS TAB */

    const videos =
        posts.filter(
            post =>
                post.content_type === "video" ||
                (
                    post.video_url &&
                    !post.content_type
                )
        );


    renderPostGrid(
        "profileVideoGrid",
        videos
    );

}


/* =========================
   RENDER GRID
========================= */

function renderPostGrid(
    elementId,
    posts
) {

    const grid =
        document.getElementById(
            elementId
        );


    grid.innerHTML =
        "";


    if (
        !posts ||
        posts.length === 0
    ) {

        grid.innerHTML =
            `
            <div
                class="empty-state"
                style="grid-column:1/-1;"
            >

                <div class="empty-icon">
                    ▦
                </div>

                <div class="empty-title">
                    No posts yet
                </div>

                <div class="empty-description">
                    Your uploaded content will appear here.
                </div>

            </div>
            `;

        return;
    }


    posts.forEach(
    post => {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "post-card";


        card.onclick =
            function() {

                if (
                    post.video_url
                ) {

                    window.open(
                        post.video_url,
                        "_blank"
                    );

                }

                else if (
                    post.video_url
                ) {

                    window.open(
                        post.video_url,
                        "_blank"
                    );

                }

            };


        /* POST MEDIA */

        let mediaHTML = "";


        if (
            post.thumbnail_url
        ) {

            mediaHTML =
                `
                <img
                    src="${escapeHtml(
                        post.thumbnail_url
                    )}"
                    alt=""
                >
                `;

        }

        else {

            mediaHTML =
                `
                <div
                    class="post-placeholder"
                >
                    ${escapeHtml(
                        post.title ||
                        "Post"
                    )}
                </div>
                `;

        }


        /* POST USERNAME */

        const username =
            post.username ||
            post.user_name ||
            "User";


        /* POST TITLE */

        const title =
            post.title ||
            "Untitled post";


        /* POST VIEWS */

        const views =
            Number(
                post.views || 0
            ).toLocaleString();


        /* POST DATE */

        let timeText =
            "Recently";


        if (
            post.created_at
        ) {

            const created =
                new Date(
                    post.created_at
                );

            const now =
                new Date();


            const difference =
                now.getTime() -
                created.getTime();


            const minutes =
                Math.floor(
                    difference /
                    (1000 * 60)
                );


            const hours =
                Math.floor(
                    minutes / 60
                );


            const days =
                Math.floor(
                    hours / 24
                );


            if (
                days > 0
            ) {

                timeText =
                    days +
                    (
                        days === 1
                            ? " day ago"
                            : " days ago"
                    );

            }

            else if (
                hours > 0
            ) {

                timeText =
                    hours +
                    (
                        hours === 1
                            ? " hour ago"
                            : " hours ago"
                    );

            }

            else if (
                minutes > 0
            ) {

                timeText =
                    minutes +
                    (
                        minutes === 1
                            ? " minute ago"
                            : " minutes ago"
                    );

            }

            else {

                timeText =
                    "Just now";

            }

        }


        /* BUILD POST */

        card.innerHTML =
            `
            ${mediaHTML}

            <div
                class="post-info"
            >

                <div
                    class="post-title"
                >
                    ${escapeHtml(
                        title
                    )}
                </div>

                <div
                    class="post-username"
                >
                    @${escapeHtml(
                        username
                    )}
                </div>

                <div
                    class="post-meta"
                >
                    ${views} views
                    ·
                    ${timeText}
                </div>

            </div>
            `;


        /* VIDEO INDICATOR */

        if (
            post.content_type ===
            "video"
        ) {

            const indicator =
                document.createElement(
                    "div"
                );

            indicator.className =
                "video-indicator";

            indicator.textContent =
                "▶";

            card.appendChild(
                indicator
            );

        }


        grid.appendChild(
            card
        );

    }
);

}

        "block";


    document.getElementById(
        "editPanel"

/* =========================
   SAVE PROFILE
========================= */

window.saveProfile =
async function() {

    const username =
        document.getElementById(
            "editUsername"
        ).value.trim();


    const fullName =
        document.getElementById(
            "editFullName"
        ).value.trim();


    const bio =
        document.getElementById(
            "editBio"
        ).value.trim();


    if (!username) {

        alert(
            "Username cannot be empty."
        );

        return;
    }


    const {
        error
    } =
    await supabase
        .from("profiles")
        .update({

            username:
                username,

            full_name:
                fullName,

            bio:
                bio

        })
        .eq(
            "id",
            currentUser.id
        );


    if (error) {

        alert(
            "Could not update profile: " +
            error.message
        );

        return;
    }


    alert(
        "Profile updated successfully!"
    );


    location.reload();

};


/* =========================
   SHARE PROFILE
========================= */

window.shareProfile =
async function() {

    const username =
        document.getElementById(
            "topUsername"
        ).textContent;


    const profileUrl =
        window.location.href;


    try {

        if (
            navigator.share
        ) {

            await navigator.share({

                title:
                    username +
                    "'s Profile",

                url:
                    profileUrl

            });

        } else {

            await navigator.clipboard.writeText(
                profileUrl
            );

            alert(
                "Profile link copied!"
            );

        }

    } catch (error) {

        console.log(
            "Share cancelled."
        );

    }

};


/* =========================
   PROFILE MENU
========================= */

window.toggleProfileMenu =
function() {

    const menu =
        document.getElementById(
            "profileMenuPanel"
        );


    if (
        menu.style.display ===
        "block"
    ) {

        menu.style.display =
            "none";

    } else {

        menu.style.display =
            "block";

    }

};


/* =========================
   TABS
========================= */

window.showProfileTab =
function(
    tabName,
    button
) {

    document
        .querySelectorAll(
            ".profile-tab"
        )
        .forEach(
            tab => {

                tab.classList.remove(
                    "active"
                );

            }
        );


    button.classList.add(
        "active"
    );


    const sections = {

        videos:
            "profileVideos",

        shorts:
            "profileShorts",

        posts:
            "profilePosts",

        live:
            "profileLive",

        playlists:
            "profilePlaylists"

    };


    Object
        .values(sections)
        .forEach(
            id => {

                const section =
                    document.getElementById(
                        id
                    );

                if (section) {

                    section.style.display =
                        "none";

                }

            }
        );


    const selectedSection =
        document.getElementById(
            sections[tabName]
        );


    if (selectedSection) {

        selectedSection.style.display =
            "block";

    }

};


/* =========================
   LOGOUT
========================= */

window.logout =
async function() {

    const {
        error
    } =
    await supabase.auth.signOut();


    if (error) {

        alert(
            "Logout failed: " +
            error.message
        );

        return;
    }


    window.location.href =

};


/* =========================
   HTML SAFETY
========================= */

function escapeHtml(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   CLOSE MENU WHEN CLICKING
   OUTSIDE
========================= */

document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "profileMenuPanel"
            );


        const button =
            document.querySelector(
                ".menu-button"
            );


        if (
            menu.style.display ===
                "block" &&
            !menu.contains(event.target) &&
            !button.contains(event.target)
        ) {

            menu.style.display =
                "none";

        }

    }
);
