<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyPlatform - Profile</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 64px;
    background: #181818;
    border-bottom: 1px solid #292929;

    display: flex;
    align-items: center;

    padding: 0 18px;

    position: sticky;
    top: 0;
    z-index: 100;
}

.back {
    border: 0;
    background: transparent;
    color: white;

    font-size: 26px;
    cursor: pointer;

    margin-right: 15px;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
}

.logo span {
    color: #ff1744;
}

.container {
    width: 100%;
    max-width: 1100px;

    margin: auto;

    padding: 30px 18px 70px;
}

/* PROFILE */

.profile-card {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 20px 0 0;
    display: grid;
    grid-template-columns: 100px 1fr auto;
    grid-template-areas:
        "avatar info menu"
        "avatar stats menu"
        "avatar bio menu"
        "avatar actions menu";
    column-gap: 24px;
    align-items: start;
}

.avatar {
    grid-area: avatar;

    width: 88px;
    height: 88px;

    border-radius: 50%;

    background: linear-gradient(
        135deg,
        #ff1744,
        #7c4dff
    );

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 40px;
    font-weight: bold;

    overflow: hidden;
    flex-shrink: 0;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.profile-info {
    grid-area: info;
    min-width: 0;
}

.username {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
}

.full-name {
    color: #aaa;
    margin-top: 5px;
    font-size: 15px;
}

.bio {
    grid-area: bio;
    color: #ddd;
    margin-top: 12px;
    line-height: 1.5;
}

.profile-stats {
    grid-area: stats;

    display: flex;
    gap: 30px;
    margin-top: 14px;
}

.profile-stat {
    text-align: center;
}

.profile-stat-number {
    display: block;
    font-size: 17px;
    font-weight: bold;
}

.profile-stat-label {
    display: block;
    color: #999;
    font-size: 13px;
    margin-top: 3px;
}

.profile-actions {
    grid-area: actions;

    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.edit,
.share-profile {
    border: 1px solid #3a3a3a;
    padding: 10px 22px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

.edit {
    background: white;
    color: black;
}

.share-profile {
    background: #181818;
    color: white;
}

.profile-menu {
    grid-area: menu;

    border: none;
    background: transparent;
    color: white;

    font-size: 25px;
    cursor: pointer;

    width: 45px;
    height: 45px;
    border-radius: 50%;
}

.profile-menu:hover {
    background: #242424;
}

/* PROFILE TABS */

.profile-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);

    margin-top: 35px;

    border-top: 1px solid #292929;
    border-bottom: 1px solid #292929;
}

.profile-tab {
    border: none;
    background: transparent;
    color: #888;

    padding: 16px 10px;

    font-size: 20px;
    cursor: pointer;
}

.profile-tab span {
    display: block;
    font-size: 11px;
    margin-top: 5px;
}

.profile-tab:hover,
.profile-tab.active {
    color: white;
}

.profile-tab.active {
    border-bottom: 2px solid white;
}

/* MENU */

.menu {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;

    margin-top: 25px;
}

.menu-button {
    background: #181818;

    border: 1px solid #292929;

    border-radius: 12px;

    color: white;

    padding: 20px;

    text-align: left;

    cursor: pointer;
}

.menu-button:hover {
    background: #242424;
}

.icon {
    font-size: 27px;
}

.title {
    font-size: 17px;

    font-weight: bold;

    margin-top: 10px;
}

.description {
    color: #999;

    font-size: 13px;

    margin-top: 5px;
}

/* CONTENT */

.content {
    margin-top: 35px;
}

.content h2 {
    margin-bottom: 18px;
}

.video-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(230px, 1fr)
        );

    gap: 18px;
}

.video-card {
    background: #181818;

    border-radius: 10px;

    overflow: hidden;

    border: 1px solid #292929;

    cursor: pointer;
}

.thumbnail {
    width: 100%;

    aspect-ratio: 16 / 9;

    background: #242424;

    object-fit: cover;

    display: block;
}

.video-info {
    padding: 12px;
}

.video-title {
    font-weight: bold;

    line-height: 1.3;
}

.video-meta {
    color: #888;

    font-size: 13px;

    margin-top: 7px;
}

/* PLAYLIST */

.playlist {
    background: #181818;

    border: 1px solid #292929;

    padding: 18px;

    border-radius: 10px;

    margin-bottom: 10px;
}

.playlist-name {
    font-size: 17px;

    font-weight: bold;
}

.playlist-description {
    color: #999;

    margin-top: 6px;

    font-size: 14px;
}

/* EDIT */

.edit-panel {
    background: #181818;

    border: 1px solid #292929;

    border-radius: 12px;

    padding: 22px;

    margin-top: 25px;

    display: none;
}

.edit-panel input,
.edit-panel textarea {
    width: 100%;

    background: #0f0f0f;

    color: white;

    border: 1px solid #333;

    border-radius: 8px;

    padding: 12px;

    margin-top: 7px;

    margin-bottom: 15px;

    font-family: inherit;
}

.edit-panel textarea {
    min-height: 100px;

    resize: vertical;
}

.save-profile {
    background: #ff1744;

    color: white;

    border: none;

    border-radius: 8px;

    padding: 11px 18px;

    cursor: pointer;

    font-weight: bold;
}

.cancel {
    background: #333;

    color: white;

    border: none;

    border-radius: 8px;

    padding: 11px 18px;

    cursor: pointer;

    margin-left: 8px;
}

/* LOGOUT */

.logout {
    width: 100%;

    margin-top: 25px;

    padding: 14px;

    background: transparent;

    color: #ff5270;

    border: 1px solid #4b2029;

    border-radius: 10px;

    cursor: pointer;

    font-weight: bold;
}

.empty {
    color: #999;

    padding: 30px 0;

    text-align: center;
}

.loading {
    text-align: center;

    color: #999;

    padding: 50px;
}

/* MOBILE */

@media(max-width: 650px) {

    .profile-card {
        flex-direction: column;

        text-align: center;
    }

    .menu {
        grid-template-columns: 1fr;
    }

    .edit {
        margin-top: 5px;
    }

    .video-grid {
        grid-template-columns: 1fr;
    }
}
</style>

<script type="module">

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


const SUPABASE_URL =
"https://xhqhnafxwblskgjrveqy.supabase.co";


const SUPABASE_KEY =
"sb_publishable_vH0tiWjZW5z6l_5kANO_ig_Y3odvC3-";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;


/* LOAD PROFILE */

async function loadProfile() {

    const {
        data,
        error
    } =
    await supabase.auth.getUser();


    if (
        error ||
        !data.user
    ) {

        window.location.href =
        "/login.html";

        return;
    }


    currentUser =
    data.user;


    const {
        data: profile,
        error: profileError
    } =
    await supabase
    .from("profiles")
    .select(
        "username, full_name, avatar_url, bio"
    )
    .eq(
        "id",
        currentUser.id
    )
    .single();


    if (profileError) {

        console.error(
            profileError
        );

        document.getElementById(
            "loading"
        ).textContent =
        "Could not load profile.";

        return;
    }


    document.getElementById(
        "username"
    ).textContent =
    "@" +
    (
        profile.username ||
        "user"
    );


    document.getElementById(
        "fullName"
    ).textContent =
    profile.full_name || "";


    document.getElementById(
        "bio"
    ).textContent =
    profile.bio ||
    "No bio yet.";


    const avatar =
    document.getElementById(
        "avatar"
    );


    if (
        profile.avatar_url
    ) {

        avatar.innerHTML =
        `
        <img
            src="${profile.avatar_url}"
        >
        `;

    } else {

        avatar.textContent =
        (
            profile.username ||
            "U"
        )
        .charAt(0)
        .toUpperCase();

    }


    document.getElementById(
        "editUsername"
    ).value =
    profile.username || "";


    document.getElementById(
        "editFullName"
    ).value =
    profile.full_name || "";


    document.getElementById(
        "editBio"
    ).value =
    profile.bio || "";


    document.getElementById(
        "loading"
    ).style.display =
    "none";


    document.getElementById(
        "profileArea"
    ).style.display =
    "block";
}


/* EDIT PROFILE */

window.showEdit =
function() {

    document.getElementById(
        "editPanel"
    ).style.display =
    "block";

};


window.hideEdit =
function() {

    document.getElementById(
        "editPanel"
    ).style.display =
    "none";

};


window.saveProfile =
async function() {

    const username =
    document.getElementById(
        "editUsername"
    ).value.trim();


    const fullName =
    document.getElementById(
        "editFullName"
    ).value.trim();


    const bio =
    document.getElementById(
        "editBio"
    ).value.trim();


    if (!username) {

        alert(
            "Username cannot be empty."
        );

        return;
    }


    const {
        error
    } =
    await supabase
    .from("profiles")
    .update({
        username:
        username,

        full_name:
        fullName,

        bio:
        bio
    })
    .eq(
        "id",
        currentUser.id
    );


    if (error) {

        alert(
            "Could not update profile: " +
            error.message
        );

        return;
    }


    alert(
        "Profile updated successfully!"
    );


    location.reload();

};


/* VIDEO CARD */

function createVideoCard(video) {

    const card =
    document.createElement(
        "div"
    );

    card.className =
    "video-card";


    card.onclick =
    function() {

        if (
            video.video_url
        ) {

            window.open(
                video.video_url,
                "_blank"
            );

        }

    };


    const thumbnail =
    video.thumbnail_url ||
    "https://via.placeholder.com/640x360?text=Video";


    card.innerHTML =
    `
    <img
        class="thumbnail"
        src="${thumbnail}"
        alt=""
    >

    <div class="video-info">

        <div class="video-title">
            ${escapeHtml(video.title || "Untitled video")}
        </div>

        <div class="video-meta">
            ${Number(video.views || 0).toLocaleString()}
            views
        </div>

    </div>
    `;


    return card;
}


/* RENDER VIDEOS */

function renderVideos(
    title,
    videos
) {

    const content =
    document.getElementById(
        "content"
    );


    content.innerHTML =
    `<h2>${title}</h2>`;


    if (
        !videos ||
        videos.length === 0
    ) {

        content.innerHTML +=
        `
        <div class="empty">
            No videos here yet.
        </div>
        `;

        return;
    }


    const grid =
    document.createElement(
        "div"
    );

    grid.className =
    "video-grid";


    videos.forEach(
        video => {

            grid.appendChild(
                createVideoCard(
                    video
                )
            );

        }
    );


    content.appendChild(
        grid
    );
}

    }


    const content =
    document.getElementById(
        "content"
    );


    content.innerHTML =
    "<h2>📋 Playlists</h2>";


    if (
        !data ||
        data.length === 0
    ) {

        content.innerHTML +=
        `
        <div class="empty">
            You haven't created any playlists yet.
        </div>
        `;

        return;
    }


    data.forEach(
        playlist => {

            const div =
            document.createElement(
                "div"
            );

            div.className =
            "playlist";


            div.innerHTML =
            `
            <div class="playlist-name">
                ${escapeHtml(
                    playlist.name
                )}
            </div>

            <div class="playlist-description">
                ${escapeHtml(
                    playlist.description ||
                    "No description"
                )}
            </div>
            `;


            content.appendChild(
                div
            );

        }
    );
};


/* GET VIDEOS */

async function getVideosFromIds(
    ids
) {

    if (
        !ids ||
        ids.length === 0
    ) {

        return [];
    }


    const {
        data,
        error
    } =
    await supabase
    .from("videos")
    .select(
        "*"
    )
    .in(
        "id",
        ids
    );


    if (error) {

        showError(error);

        return [];
    }


    /*
       Keep the same order
       as the history/likes/
       saved list.
    */

    const map =
    new Map(
        data.map(
            video =>
            [
                String(video.id),
                video
            ]
        )
    );


    return ids
    .map(
        id =>
        map.get(
            String(id)
        )
    )
    .filter(
        Boolean
    );
}


/* ERROR */

function showError(
    error
) {

    console.error(
        error
    );


    document.getElementById(
        "content"
    ).innerHTML =
    `
    <div class="empty">
        Could not load this section.
        <br><br>
        ${escapeHtml(
            error.message ||
            "Unknown error"
        )}
    </div>
    `;
}


/* HTML SAFETY */

function escapeHtml(
    value
) {

    return String(value)
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}

async function shareProfile() {

    const username =
        document.getElementById("username").textContent;

    const profileUrl =
        window.location.href;

    try {

        if (navigator.share) {

            await navigator.share({
                title: username + "'s Profile",
                url: profileUrl
            });

        } else {

            await navigator.clipboard.writeText(
                profileUrl
            );

            alert("Profile link copied!");

        }

    } catch (error) {

        console.log(
            "Share cancelled or unavailable."
        );

    }
}
function showProfileTab(tabName, button) {

    document
        .querySelectorAll(".profile-tab")
        .forEach(tab => {
            tab.classList.remove("active");
        });

    button.classList.add("active");


    const sections = {
        posts: "profilePosts",
        videos: "profileVideos",
        reposts: "profileReposts",
        tagged: "profileTagged"
    };


    Object.values(sections).forEach(id => {

        document.getElementById(id).style.display =
            "none";

    });


    if (sections[tabName]) {

        document.getElementById(
            sections[tabName]
        ).style.display = "block";

    }
}
